name: Pipeline de contenido

# Corre las 4 etapas (plan -> guion -> video -> subida a YouTube) en el
# runner de GitHub Actions.
#
# A diferencia del pipeline hermano (video-scout-pipeline), este NO corre
# en cron por defecto: la generación de video con Veo consume cuota de
# pago y es lenta, así que hasta que confirmes el costo/tiempo real por
# video, lánzalo a mano desde la pestaña "Actions" (workflow_dispatch).
# Si más adelante quieres automatizarlo del todo, descomenta el bloque
# "schedule" de abajo.
#
# Requisitos antes de lanzarlo (ver README.md):
#   1. Secrets del repo (Settings -> Secrets and variables -> Actions):
#        GEMINI_API_KEY        - API key de https://aistudio.google.com/apikey
#        YOUTUBE_CLIENT_SECRET - contenido de tu client_secret.json (OAuth desktop)
#        YOUTUBE_TOKEN         - contenido de youtube_token.json ya autorizado
#                                 una vez en tu máquina (ver README)
#   2. config.json (ya está commiteado en el repo, sin datos sensibles —
#      ajusta canales_referencia y demás ahí si quieres cambiarlos).

on:
  workflow_dispatch:
    inputs:
      desde_etapa:
        description: "Empezar desde esta etapa. 'video' salta plan y guion, o sea que NO llama a Gemini para texto (necesita un guion ya existente o usar_guion_semilla)"
        required: false
        default: "plan"
        type: choice
        options: ["plan", "guion", "video", "publicar"]
      usar_guion_semilla:
        description: "Copiar guion.semilla.txt (escrito a mano, versionado en el repo) como guion de esta corrida. Con desde_etapa=video y hasta_etapa=video, la corrida entera no toca la API de Gemini"
        required: false
        default: false
        type: boolean
      hasta_etapa:
        description: "Correr solo hasta esta etapa (plan, guion, video, publicar)"
        required: false
        default: "publicar"
        type: choice
        options: ["plan", "guion", "video", "publicar"]
      motor_broll:
        # Por defecto va el motor gratuito, que es el que usa el canal. Con "veo"
        # de default, una corrida disparada sin tocar este campo (por API, o
        # dándole a Run workflow de una) se va a Veo y quema la cuota diaria sin
        # ejecutar nada de HyperFrames: pasó en la corrida 34003101637.
        description: "Motor de video de apoyo (hyperframes/manim = animación por código, gratis; veo = IA generativa, con cuota)"
        required: false
        default: "hyperframes"
        type: choice
        options: ["hyperframes", "manim", "veo"]
      motor_tts:
        description: "Motor de narración (edge = gratis sin límite; gemini = tope de 10 solicitudes/día)"
        required: false
        default: "edge"
        type: choice
        options: ["edge", "gemini"]
      regenerar_guion:
        description: "Descartar el guion, los clips cacheados y los videos ya hechos, y escribir todo de nuevo (necesario al cambiar de motor_broll: los prompts visuales se escriben distinto para cada motor)"
        required: false
        default: false
        type: boolean
      regenerar_plan:
        description: "Descartar también el plan de contenido y volver a planificar (necesario al cambiar de formato: el plan viejo trae duraciones y títulos del formato anterior). Implica regenerar el guion y el video"
        required: false
        default: false
        type: boolean
      regenerar_video:
        description: "Rehacer el video con el MISMO guion (descarta los videos ya montados, no el guion). Para cuando cambia cómo se dibujan o se montan las escenas, no lo que dicen"
        required: false
        default: false
        type: boolean
  # schedule:
  #   - cron: "0 14 * * *"  # todos los días 14:00 UTC — descomenta cuando quieras automatizarlo

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar ffmpeg y dependencias nativas de Manim
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev

      # Sin esto, el estilo de subtítulos pide "Montserrat Black" y libass cae en
      # silencio a la tipografía por defecto del runner: el karaoke se ve con
      # otra letra, sin que nada lo reporte.
      - name: Instalar la tipografía de los subtítulos (Montserrat Black)
        run: |
          sudo apt-get install -y fonts-montserrat
          fc-list | grep -qi "Montserrat-Black" || { echo "Montserrat Black no quedó instalada"; exit 1; }

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar Node.js (necesario si motor_broll = hyperframes)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar @hyperframes/core (para el voiceover carve de vendor/carve.mjs)
        run: npm ci

      - name: Precalentar HyperFrames (descarga el paquete y su Chromium una sola vez)
        if: ${{ github.event.inputs.motor_broll == 'hyperframes' }}
        run: npx --yes hyperframes@0.8.27 --version

      - name: Fijar motor de video de apoyo y de narración
        env:
          MOTOR_BROLL: ${{ github.event.inputs.motor_broll || 'hyperframes' }}
          MOTOR_TTS: ${{ github.event.inputs.motor_tts || 'edge' }}
        run: |
          python -c "
          import json, os
          with open('config.json') as f:
              cfg = json.load(f)
          cfg['motor_broll'] = os.environ['MOTOR_BROLL']
          cfg['motor_tts'] = os.environ['MOTOR_TTS']
          with open('config.json', 'w') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          "

      - name: Restaurar caché de pipeline_state (persiste clips ya generados entre corridas)
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline_state
            guion.txt
            Videos Creados
          key: pipeline-state-${{ github.run_id }}
          restore-keys: |
            pipeline-state-

      - name: Descartar el plan de contenido (regenerar_plan)
        if: ${{ github.event.inputs.regenerar_plan == 'true' }}
        run: |
          rm -f pipeline_state/plan_contenido.json
          echo "Plan de contenido descartado: se planifica de nuevo en esta corrida."

      - name: Descartar guion y clips cacheados (regenerar_guion)
        if: ${{ github.event.inputs.regenerar_guion == 'true' || github.event.inputs.regenerar_plan == 'true' }}
        run: |
          rm -f guion.txt
          rm -rf "Videos Creados" pipeline_state/hyperframes_cache pipeline_state/manim_cache
          echo "Guion, videos y clips cacheados descartados: se reescriben en esta corrida."

      - name: Descartar solo los videos ya montados (regenerar_video)
        if: ${{ github.event.inputs.regenerar_video == 'true' && github.event.inputs.regenerar_guion != 'true' }}
        run: |
          rm -rf "Videos Creados"
          echo "Videos descartados: se vuelven a montar con el guion que ya está cacheado."

      - name: Usar el guion semilla versionado en el repo (usar_guion_semilla)
        if: ${{ github.event.inputs.usar_guion_semilla == 'true' }}
        run: |
          cp guion.semilla.txt guion.txt
          echo "Guion tomado de guion.semilla.txt (sin llamar al modelo):"
          head -4 guion.txt

      - name: Restaurar credenciales de YouTube
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YOUTUBE_TOKEN" > youtube_token.json

      - name: Correr pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python pipeline.py \
            --desde "${{ github.event.inputs.desde_etapa || 'plan' }}" \
            --hasta "${{ github.event.inputs.hasta_etapa || 'publicar' }}"

      - name: Subir logs, estado y videos como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            pipeline_state/
            guion.txt
            Videos Creados
          retention-days: 14

      - name: Guardar caché de pipeline_state (aunque el pipeline haya fallado)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline_state
            guion.txt
            Videos Creados
          key: pipeline-state-${{ github.run_id }}
